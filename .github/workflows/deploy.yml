name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/multi-payer-settlement-system-jaweia, main]
  workflow_dispatch:

# ให้ workflow นี้ push ขึ้น Pages ได้
permissions:
  contents: read
  pages: write
  id-token: write

# deploy ทีละรอบ ถ้ามี push ซ้อนเข้ามาให้รอรอบก่อนจบ ไม่ตัดกลางคัน
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # เลขต้องถูกก่อน ถ้า test ไม่ผ่านห้าม deploy
      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # ครั้งแรกต้องเปิด Pages ด้วยมือก่อน: Settings > Pages > Source: GitHub Actions
      # (GITHUB_TOKEN ของ workflow ไม่มีสิทธิ์สร้าง Pages site ให้เอง)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
