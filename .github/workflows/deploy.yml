name: Deploy to GitHub Pages

on:
  # deploy เฉพาะ main เท่านั้น
  # environment github-pages ล็อกไว้ให้ deploy ได้จาก default branch อยู่แล้ว
  # ถ้าให้ branch อื่นรันด้วย มันจะ fail ทุกครั้ง แล้วยังไปแย่ง concurrency group
  # จน run ของ main โดนยกเลิกทิ้ง ซึ่งเคยทำให้ไฟล์อัตราไม่ขึ้นเว็บมาแล้ว
  push:
    branches: [main]
  workflow_dispatch:
  # GitHub จงใจไม่ trigger workflow จาก push ที่ใช้ GITHUB_TOKEN (กันลูปไม่รู้จบ)
  # ไฟล์อัตราที่ bot commit เข้ามาจึงไม่เคยถูก deploy ต้องดักที่ตอน workflow นั้นจบแทน
  workflow_run:
    workflows: ['Update exchange rates']
    types: [completed]

# ให้ workflow นี้ push ขึ้น Pages ได้
permissions:
  contents: read
  pages: write
  id-token: write

# deploy ทีละรอบ ถ้ามี push ซ้อนเข้ามาให้รอรอบก่อนจบ ไม่ตัดกลางคัน
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # ถ้ามาจาก workflow อัตรา ให้ deploy เฉพาะตอนที่ดึงอัตราสำเร็จ
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # เลขต้องถูกก่อน ถ้า test ไม่ผ่านห้าม deploy
      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # ครั้งแรกต้องเปิด Pages ด้วยมือก่อน: Settings > Pages > Source: GitHub Actions
      # (GITHUB_TOKEN ของ workflow ไม่มีสิทธิ์สร้าง Pages site ให้เอง)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
